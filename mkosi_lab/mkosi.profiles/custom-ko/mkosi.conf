[Include]
Include=
    ../kernel

[Content]
KernelModules=
    # allow block devices and contain zram
    drivers/block/
    # manages dynamic CPU frequency for performance and power efficiency
    drivers/cpufreq/
    # manages CPU idle states, reducing power draw
    drivers/cpuidle/
    # manages dynamic non-CPU (i.e. memory controller) frequency for power efficiency
    drivers/devfreq/
    # contains most of nic drivers
    drivers/net/ethernet/
    # for PHY chip that need their own drivers
    drivers/net/phy/
    # manages thermal and prevent overheating by throttling system
    drivers/thermal/
    # drivers/power/reset allow hardware to gracefully restart
    drivers/power/
    # enforces hard power consumption limit
    drivers/powercap/
    # for hardware clock signals
    drivers/clk/
    # multiple important utilities (manages thermal, discover hardware)
    drivers/acpi/
    # hardware monitoring
    drivers/hwmon/
    # system-on-chip drivers
    drivers/soc/

    arch/.*/crypto/
    lib/
    mm/

    net/(core|ipv4|ipv6|sched|tls|netfilter|unix|packet|8021q|bridge|vmw_vsock|dsa)/
    drivers/net/wireguard/
    drivers/virtio/
    drivers/vhost/

    drivers/watchdog/
    drivers/edac/
    drivers/ras/
    drivers/char/hw_random/
    drivers/char/tpm/
    drivers/char/ipmi/
    drivers/input/[^/]*$

    drivers/firmware/
    drivers/rtc/
    drivers/ptp/
    drivers/pps/

    fs/(erofs|squashfs|overlayfs|efivarfs|fuse|nls|netfs)/
    # fs/(ext4|xfs|btrfs|fat|iomap)/

    # drivers/nvme/host/
    # drivers/ata/
    # drivers/scsi/
    # drivers/md/
    # drivers/dax/
    # drivers/usb/

    # global exclusion of legacy and test files
    !drivers/block/(floppy|pktcdvd|aoe|drbd|rnbd)
    !.*test.*
    !lib/kunit/

