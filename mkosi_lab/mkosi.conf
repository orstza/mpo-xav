# [Build]
# Incremental=yes

[Distribution]
Distribution=fedora
Release=44

[Content]
Autologin=true
RootPassword=hashed:
Packages=
    systemd
    systemd-udev
    systemd-networkd
    systemd-resolved
    kmod
    iproute
    bash
    coreutils
    util-linux
    git
# KernelModules=!.*
# FirmwareFiles=!.*
KernelModules=
    default
WithRecommends=True
WithNetwork=yes