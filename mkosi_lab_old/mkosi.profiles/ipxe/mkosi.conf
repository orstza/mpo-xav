[Include]
Include=../kernel

[Content]
InitrdProfiles=network
KernelInitrdModules=
    # sufficient for HTTP and SNP/other fallback 
    drivers/net/ethernet/
    drivers/net/phy/
    drivers/block/

    # for QEMU iPXE boot using virtual nic drivers
    # /drivers/block/loop
    # /drivers/net/virtio_net
    # /drivers/virtio/virtio_pci

[Output]
Format=disk
OutputDirectory=%D/images/ipxe/%d/%r/%a